name: Release

# Release by version bump: bump `version: 'X.Y.Z+N'` in pubspec.yaml (N = versionCode), push to
# the default branch, done. This workflow creates tag vX.Y.Z and a GitHub release with the signed
# split-per-ABI APKs. Tags are never pushed by hand. Pushes that don't change the version are
# no-ops. workflow_dispatch re-runs a failed release of the current version.
# Adapted from the workspace's Gradle template (templates README, "Releasing (Android)").

on:
  push:
    paths:
      - pubspec.yaml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION_FILE: pubspec.yaml

jobs:
  check:
    # Only the default branch releases; a push to any other branch never does.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, for the upgradeability guard

      - name: Read version, skip if already released
        id: version
        run: |
          # `version: 'X.Y.Z+N'`, quotes optional; prints "X.Y.Z N" (N empty if absent).
          read_version() { sed -nE "s/^version:[[:space:]]*['\"]?([0-9]+\.[0-9]+\.[0-9]+)(\+([0-9]+))?['\"]?[[:space:]]*$/\1 \3/p" | head -n1; }
          read -r NAME CODE <<< "$(read_version < "$VERSION_FILE")"
          if [ -z "$NAME" ] || [ -z "$CODE" ]; then
            echo "::error file=$VERSION_FILE::Could not read version: 'x.y.z+N' (the +N build number is required)"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/v$NAME" > /dev/null; then
            echo "v$NAME is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Upgradeability guard: the new versionCode must be greater than the previous release's.
          # Releases up to v2.3.0 had no +N in pubspec.yaml, so Flutter built them with N = 1.
          PREV=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -n "$PREV" ]; then
            read -r PREV_NAME PREV_CODE <<< "$(git show "$PREV:$VERSION_FILE" 2>/dev/null | read_version)"
            if [ -z "$PREV_NAME" ]; then
              echo "::error::Could not read version from $VERSION_FILE at $PREV"
              exit 1
            fi
            PREV_CODE=${PREV_CODE:-1}
            if [ "$CODE" -le "$PREV_CODE" ]; then
              echo "::error file=$VERSION_FILE::versionCode $CODE is not greater than $PREV's $PREV_CODE; the APK would not install as an update"
              exit 1
            fi
          fi
          echo "Releasing v$NAME (versionCode $CODE, previous: ${PREV:-none})"
          echo "release=true" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      VERSION_NAME: ${{ needs.check.outputs.name }}
      VERSION_CODE: ${{ needs.check.outputs.code }}
    steps:
      # Never publish unsigned: fail before building if the secrets are missing.
      - name: Require signing secrets
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_BASE64 and KEYSTORE_PASSWORD repo secrets are required to release"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: '21.x'
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: "3.41.x"

      - name: Setup Flutter
        run: |
          flutter config --no-analytics
          flutter pub get
          dart pub global activate script_runner
          scr build

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm \
            --build-name="$VERSION_NAME" --build-number="$VERSION_CODE"

      - name: Sign APKs
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)
          RELEASE_DIR=build/app/outputs/apk/release
          for UNSIGNED in "$RELEASE_DIR"/app-*-release.apk; do
            case "$(basename "$UNSIGNED")" in
              *arm64-v8a*)   ABI=arm64-v8a ;;
              *armeabi-v7a*) ABI=armeabi-v7a ;;
              *)             ABI=universal ;;
            esac
            SIGNED="$RELEASE_DIR/com.craeckie.workouttimer-${VERSION_NAME}-${ABI}.apk"
            "${BUILD_TOOLS}apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-key-alias my-key \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEYSTORE_PASSWORD" \
              --v1-signing-enabled false \
              --v2-signing-enabled true \
              --v3-signing-enabled false \
              --out "$SIGNED" \
              "$UNSIGNED"
            "${BUILD_TOOLS}apksigner" verify --print-certs "$SIGNED"
          done
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^# \['"$VERSION_NAME"'\]/{found=1; next} found && /^(---|# \[)/{exit} found' \
            CHANGELOG.md > "$RUNNER_TEMP/release_notes.md"
          if [ -s "$RUNNER_TEMP/release_notes.md" ]; then
            NOTES=(--notes-file "$RUNNER_TEMP/release_notes.md")
          else
            NOTES=(--generate-notes)
          fi
          gh release create "v$VERSION_NAME" \
            build/app/outputs/apk/release/com.craeckie.workouttimer-*.apk \
            --target "$GITHUB_SHA" \
            --title "v$VERSION_NAME" \
            "${NOTES[@]}"
